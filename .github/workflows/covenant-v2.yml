# SPDX-License-Identifier: Apache-2.0
name: Covenant v2 source-pinned evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  KHIPU_COMMIT: a5ccc9574dd921dd001bcf4ddd8eef785ccab11c
  # Separately reviewed candidate PR32, not a claim that this commit is main:
  # https://github.com/szl-holdings/szl-crosscheck/pull/32
  CROSSCHECK_COMMIT: ec7443a5cda273e2fd4728448d9dad37695eec60
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  covenant-v2:
    name: Local synthetic STH v2 and exact Merkle evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The three repositories are siblings. A dependency checkout must not
      # dirty the Eclipse worktree whose clean Git identity is under test.
      - name: Checkout the exact Eclipse workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: eclipse
          persist-credentials: false
      - name: Checkout the pinned Khipu implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/khipu-consensus
          ref: ${{ env.KHIPU_COMMIT }}
          path: khipu
          persist-credentials: false
      - name: Checkout the pinned Crosscheck candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: szl-holdings/szl-crosscheck
          ref: ${{ env.CROSSCHECK_COMMIT }}
          path: crosscheck
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install test dependencies in the isolated CI environment
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 cryptography==50.0.2
      - name: Test evidence acceptance and provenance failures
        working-directory: eclipse
        run: python -B -m pytest tests/test_covenant_v2_evidence.py -q --basetemp="$RUNNER_TEMP/covenant-evidence-tests"
      - name: Test independent chain and Merkle comparison
        working-directory: crosscheck
        env:
          PYTHONPATH: ${{ github.workspace }}/crosscheck/src
        run: python -B -m pytest tests/test_covenant.py -q --basetemp="$RUNNER_TEMP/covenant-crosscheck-tests"
      - name: Execute the real cross-repository battery
        run: |
          python -B "$GITHUB_WORKSPACE/eclipse/tools/covenant_v2_evidence.py" \
            --khipu-repo "$GITHUB_WORKSPACE/khipu" \
            --expected-khipu-commit "$KHIPU_COMMIT" \
            --eclipse-repo "$GITHUB_WORKSPACE/eclipse" \
            --expected-eclipse-commit "$GITHUB_SHA" \
            --crosscheck-repo "$GITHUB_WORKSPACE/crosscheck" \
            --expected-crosscheck-commit "$CROSSCHECK_COMMIT" \
            --output "$RUNNER_TEMP/covenant-v2-report.json"
      - name: Preserve scoped evidence even when the battery fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: covenant-v2-source-pinned-evidence
          path: ${{ runner.temp }}/covenant-v2-report.json
          if-no-files-found: error
          retention-days: 14
