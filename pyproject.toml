[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-eclipse"
version = "0.2.1"
description = "Mutation-testing for receipt verifiers - who verifies the verifier"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-eclipse"
Source = "https://github.com/szl-holdings/szl-eclipse"
Issues = "https://github.com/szl-holdings/szl-eclipse/issues"
Changelog = "https://github.com/szl-holdings/szl-eclipse/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_eclipse"] # wheel top-level import names; the release gate fails if the built wheel differs
